api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
runner:
  labels:
    - amd-mi355-1gpu
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
ut:
  commands:
    - |
      python3 - <<'PY'
      import hashlib
      import subprocess
      import sys
      from pathlib import Path

      test_file = Path("tokenspeed-kernel/test/ops/test_attention_dsv41_index_scan.py")
      probe = r'''
      import collections
      import json
      import pytest
      import torch

      traces = []
      runtime_traces = []
      original_events = torch.profiler.profile.events
      def record_events(self):
          events = original_events(self)
          traces.append(collections.Counter(
              event.name for event in events
              if event.device_type == torch.autograd.DeviceType.CUDA
          ))
          runtime_traces.append(collections.Counter(
              event.name for event in events
              if event.device_type == torch.autograd.DeviceType.CPU
              and "LaunchKernel" in event.name
          ))
          return events
      torch.profiler.profile.events = record_events
      class CapacityPrefix:
          def pytest_collection_modifyitems(self, items):
              index = next(i for i, item in enumerate(items)
                  if item.name == "test_index_scan_capacity_launches_and_scratch")
              del items[index + 1:]
      result = pytest.main([
          "tokenspeed-kernel/test/ops/", "-v",
      ], plugins=[CapacityPrefix()])
      for index, (counts, runtime) in enumerate(zip(traces, runtime_traces)):
          print("TRACE", index, "DEVICE_EVENTS", json.dumps(counts, sort_keys=True), flush=True)
          print("TRACE", index, "RUNTIME_EVENTS", json.dumps(runtime, sort_keys=True), flush=True)
      raise SystemExit(result)
      '''
      print("BASELINE_SOURCE", hashlib.sha256(test_file.read_bytes()).hexdigest(), flush=True)
      baseline = subprocess.run([sys.executable, "-c", probe], text=True, capture_output=True)
      print(baseline.stdout, flush=True)
      print(baseline.stderr, flush=True)
      reproduced = baseline.returncode == 1 and "assert launches[0]" in baseline.stdout
      print("BASELINE_REPRODUCED", reproduced, flush=True)
      source = test_file.read_text()
      marker = "                event.device_type == torch.autograd.DeviceType.CUDA\n"
      assert source.count(marker) == 1
      test_file.write_text(source.replace(marker,
          "                event.device_type == torch.autograd.DeviceType.CPU\n"
          '                and "LaunchKernel" in event.name\n'))
      print("CANDIDATE_SOURCE", hashlib.sha256(test_file.read_bytes()).hexdigest(), flush=True)
      subprocess.run([sys.executable, "-c", probe], check=True)
      subprocess.run([sys.executable, "-m", "pytest", str(test_file), "-v"], check=True)
      assert reproduced, "baseline did not reproduce launch-count mismatch"
      PY
report:
  github_step_summary: true
